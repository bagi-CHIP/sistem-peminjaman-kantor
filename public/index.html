<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Permintaan Persediaan / Barang</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #eef2f5; }
    .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .search-box { margin-bottom: 15px; width: 50%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background: #007bff; color: white; }
    button { background: #28a745; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; }
    button:hover { background: #218838; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Form Permintaan Persediaan Barang Kantor</h2>
    <form id="formPinjam">
      <div class="form-group">
        <label>Nama Pegawai *</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" placeholder="nama@kantor.go.id" required>
      </div>
      <div class="form-group">
        <label>Bidang / Sub Bagian *</label>
        <select id="bidang" required>
          <option value="">-- Pilih Bidang --</option>
          <option value="Tata Usaha">Tata Usaha</option>
          <option value="Pemeriksaan">Pemeriksaan</option>
          <option value="Infokom">Infokom</option>
          <option value="Penindakan">Penindakan</option>
        </select>
      </div>
      <div class="form-group">
        <label>Keperluan *</label>
        <textarea id="keperluan" rows="2" placeholder="Contoh: Rapat Koordinasi Wilayah" required></textarea>
      </div>

      <h3>Pilih Barang Persediaan</h3>
      <input type="text" id="search" class="search-box" placeholder="🔍 Cari kode atau nama barang..." onkeyup="loadBarang()">

      <table>
        <thead>
          <tr>
            <th width="5%">Pilih</th>
            <th>Kode</th>
            <th>Nama Barang</th>
            <th>Satuan</th>
            <th>Stok Tersedia</th>
            <th width="15%">Jumlah Pinjam</th>
          </tr>
        </thead>
        <tbody id="tabelBarang"></tbody>
      </table>
      <br>
      <button type="submit">Kirim Permintaan</button>
    </form>
  </div>

  <script>
    async function loadBarang() {
      const keyword = document.getElementById('search').value;
      const res = await fetch('/api/barang?search=' + encodeURIComponent(keyword));
      const data = await res.json();
      const tbody = document.getElementById('tabelBarang');
      tbody.innerHTML = '';

      if(data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Barang tidak ditemukan</td></tr>';
        return;
      }

      data.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td style="text-align:center;">
              <input type="checkbox" class="chk-barang" data-id="${item.id}" onchange="toggleInput(this)">
            </td>
            <td>${item.kode}</td>
            <td>${item.nama}</td>
            <td>${item.satuan}</td>
            <td><b>${item.stok}</b></td>
            <td>
              <input type="number" id="jumlah-${item.id}" min="1" max="${item.stok}" value="1" disabled class="input-jumlah" data-id="${item.id}">
            </td>
          </tr>
        `;
      });
    }

    function toggleInput(chk) {
      const id = chk.dataset.id;
      const inputJumlah = document.getElementById(`jumlah-${id}`);
      inputJumlah.disabled = !chk.checked;
    }

    document.getElementById('formPinjam').addEventListener('submit', async (e) => {
      e.preventDefault();
      const items = [];
      document.querySelectorAll('.chk-barang:checked').forEach(chk => {
        const id = chk.dataset.id;
        const jumlah = parseInt(document.getElementById(`jumlah-${id}`).value);
        items.push({ barang_id: id, jumlah });
      });

      if (items.length === 0) {
        return alert('Silakan centang (✓) minimal 1 barang yang ingin dipinjam!');
      }

      const payload = {
        nama: document.getElementById('nama').value,
        email: document.getElementById('email').value,
        bidang: document.getElementById('bidang').value,
        keperluan: document.getElementById('keperluan').value,
        items
      };

      const res = await fetch('/api/peminjaman', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if(result.success) {
        alert('Permintaan berhasil dikirim!\nKode Registrasi: ' + result.nomor_pinjam);
        location.reload();
      }
    });

    loadBarang();
  </script>
</body>
</html>
